name: 🐍 Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move to output directory
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.svg output/ 2>/dev/null || true
          cp dist/github-contribution-grid-snake-dark.svg output/ 2>/dev/null || true

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update snake animation [skip ci]" || echo "No changes"
          git push
