<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betokis — Skills Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-hover: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #00d4aa;
      --accent-glow: rgba(0, 212, 170, 0.15);
      --red: #ff6b6b;
      --purple: #a855f7;
      --blue: #3b82f6;
      --orange: #ffa657;
      --green: #00d4aa;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-card: #f6f8fa;
        --bg-card-hover: #eaeef2;
        --border: #d0d7de;
        --text: #1f2328;
        --text-secondary: #656d76;
        --text-muted: #afb8c1;
        --accent: #00897b;
        --accent-glow: rgba(0, 137, 123, 0.12);
        --red: #cf222e;
        --purple: #7c3aed;
        --blue: #0550ae;
        --orange: #953800;
        --green: #00897b;
      }
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 span { -webkit-text-fill-color: var(--text); }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    .subtitle a {
      color: var(--accent);
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 1rem; }
      h1 { font-size: 1.5rem; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.2s ease;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .card.full-width {
      grid-column: 1 / -1;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h2 .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .chart-wrapper canvas {
      width: 100% !important;
      height: auto !important;
    }

    .skill-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .skill-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .skill-item .skill-icon {
      font-size: 1.2rem;
      width: 28px;
      text-align: center;
    }

    .skill-item .skill-info {
      flex: 1;
    }

    .skill-item .skill-name {
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }

    .skill-item .skill-percent {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .skill-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 3px;
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s ease;
      width: 0;
    }

    .skill-bar-fill.animate {
      width: var(--target);
    }

    .skill-superpower {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
    }

    .total-stats {
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-top: 0.5rem;
    }

    .total-stat {
      display: flex;
      flex-direction: column;
    }

    .total-stat .number {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .total-stat .label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeInUp 0.5s ease forwards; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.3s; }
    .card:nth-child(5) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>@</span>Betokis <span>·</span> Skills Radar</h1>
      <p class="subtitle">
        Interactive proficiency chart · 
        <a href="https://github.com/Betokis/Betokis">← Back to Profile</a>
      </p>
    </header>

    <div class="grid" id="app">
      <div class="card loading" id="loading">
        <div>Loading skills data...</div>
      </div>
    </div>

    <footer>
      <p>
        Data from <a href="https://github.com/Betokis/Betokis/blob/main/data/skills.json">skills.json</a>
        · Self-assessed proficiency · Updated Jun 2026
      </p>
    </footer>
  </div>

  <script>
    // Skills data (mirrors data/skills.json)
    const SKILLS_DATA = {
      categories: [
        {
          name: "Cybersecurity",
          icon: "🛡️",
          color: "#ff6b6b",
          skills: [
            { name: "Penetration Testing", proficiency: 85, superpower: "Web exploitation & AD chains", icon: "🔍" },
            { name: "Kali Linux", proficiency: 90, superpower: "Tool scripting & automation", icon: "🐉" },
            { name: "Network Security", proficiency: 80, superpower: "Protocol fuzzing & firewalking", icon: "🌐" },
            { name: "CTF / HTB", proficiency: 88, superpower: "Read the source, always", icon: "🏴" },
            { name: "Malware Analysis", proficiency: 65, superpower: "Static + dynamic in sandbox", icon: "🔬" },
            { name: "OSINT", proficiency: 72, superpower: "Connect the invisible dots", icon: "🕵️" }
          ]
        },
        {
          name: "Full-Stack Development",
          icon: "💻",
          color: "#00d4aa",
          skills: [
            { name: "Python", proficiency: 92, superpower: "Fast prototypes, cleaner code", icon: "🐍" },
            { name: "JavaScript / TypeScript", proficiency: 88, superpower: "Type-safe everything", icon: "📜" },
            { name: "React / SvelteKit", proficiency: 85, superpower: "SSR + hydration mastery", icon: "⚛️" },
            { name: "Node.js", proficiency: 82, superpower: "Streams, clusters, microservices", icon: "🟢" },
            { name: "PostgreSQL", proficiency: 80, superpower: "Window functions & query tuning", icon: "🐘" },
            { name: "GraphQL", proficiency: 75, superpower: "Schema-first design", icon: "◈" },
            { name: "Rust", proficiency: 60, superpower: "Zero-cost abstractions learner", icon: "🦀" },
            { name: "Docker / AWS", proficiency: 78, superpower: "Docker compose to ECS", icon: "🐳" }
          ]
        },
        {
          name: "Music Production",
          icon: "🎵",
          color: "#a855f7",
          skills: [
            { name: "Piano / Theory", proficiency: 82, superpower: "Jazz harmony & modal interchange", icon: "🎹" },
            { name: "DAW Production", proficiency: 85, superpower: "Renoise tracking + VST orchestration", icon: "🎛️" },
            { name: "Generative Music", proficiency: 70, superpower: "Lua scripts for algorithmic composition", icon: "🤖" },
            { name: "Sound Design", proficiency: 75, superpower: "Subtractive + FM + granular", icon: "🔊" }
          ]
        },
        {
          name: "Knowledge Systems",
          icon: "🧠",
          color: "#3b82f6",
          skills: [
            { name: "Zettelkasten", proficiency: 90, superpower: "Atomic notes + bidirectional links", icon: "🗂️" },
            { name: "PARA Method", proficiency: 85, superpower: "Folders as actions, tags as context", icon: "📋" },
            { name: "Obsidian Dataview", proficiency: 80, superpower: "SQL for your notes", icon: "📊" },
            { name: "Spaced Repetition", proficiency: 75, superpower: "FSRS algorithm optimisation", icon: "🔄" }
          ]
        }
      ]
    };

    // Color palettes for charts
    const CHART_COLORS = {
      dark: {
        cyber: ['rgba(255, 107, 107, 0.8)', 'rgba(255, 107, 107, 0.05)'],
        dev: ['rgba(0, 212, 170, 0.8)', 'rgba(0, 212, 170, 0.05)'],
        music: ['rgba(168, 85, 247, 0.8)', 'rgba(168, 85, 247, 0.05)'],
        knowledge: ['rgba(59, 130, 246, 0.8)', 'rgba(59, 130, 246, 0.05)']
      },
      light: {
        cyber: ['rgba(207, 34, 46, 0.7)', 'rgba(207, 34, 46, 0.05)'],
        dev: ['rgba(0, 137, 123, 0.7)', 'rgba(0, 137, 123, 0.05)'],
        music: ['rgba(124, 58, 237, 0.7)', 'rgba(124, 58, 237, 0.05)'],
        knowledge: ['rgba(5, 80, 174, 0.7)', 'rgba(5, 80, 174, 0.05)']
      }
    };

    function isDarkMode() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function getColors(category) {
      const palette = isDarkMode() ? CHART_COLORS.dark : CHART_COLORS.light;
      switch (category) {
        case 'Cybersecurity': return palette.cyber;
        case 'Full-Stack Development': return palette.dev;
        case 'Music Production': return palette.music;
        case 'Knowledge Systems': return palette.knowledge;
        default: return ['rgba(0, 212, 170, 0.8)', 'rgba(0, 212, 170, 0.05)'];
      }
    }

    // Create radar chart
    function createRadarChart(category) {
      const canvasId = `radar-${category.name.replace(/\s+/g, '-')}`;
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      const [borderColor, bgColor] = getColors(category.name);
      const gridColor = isDarkMode() ? 'rgba(48, 54, 61, 0.5)' : 'rgba(208, 215, 222, 0.5)';
      const labelColor = isDarkMode() ? '#8b949e' : '#656d76';

      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: category.skills.map(s => s.name),
          datasets: [{
            label: category.name,
            data: category.skills.map(s => s.proficiency),
            borderColor: borderColor,
            backgroundColor: bgColor,
            borderWidth: 2,
            pointBackgroundColor: borderColor,
            pointBorderColor: isDarkMode() ? '#0d1117' : '#ffffff',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          animation: {
            duration: 1500,
            easing: 'easeOutQuart'
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: isDarkMode() ? '#161b22' : '#f6f8fa',
              titleColor: isDarkMode() ? '#e6edf3' : '#1f2328',
              bodyColor: isDarkMode() ? '#8b949e' : '#656d76',
              borderColor: isDarkMode() ? '#30363d' : '#d0d7de',
              borderWidth: 1,
              padding: 12,
              cornerRadius: 8,
              callbacks: {
                label: function(context) {
                  const skill = category.skills[context.dataIndex];
                  return `${skill.proficiency}% — ${skill.superpower}`;
                }
              }
            }
          },
          scales: {
            r: {
              min: 0,
              max: 100,
              ticks: {
                stepSize: 20,
                color: labelColor,
                backdropColor: 'transparent',
                font: { size: 10 }
              },
              grid: {
                color: gridColor,
              },
              angleLines: {
                color: gridColor,
              },
              pointLabels: {
                color: labelColor,
                font: { size: 11, family: 'Space Grotesk', weight: '500' }
              }
            }
          }
        }
      });
    }

    // Build skill bars
    function buildSkillBars(category) {
      const container = document.getElementById(`bars-${category.name.replace(/\s+/g, '-')}`);
      if (!container) return;

      const [barColor] = getColors(category.name);

      container.innerHTML = category.skills.map(skill => `
        <div class="skill-item">
          <span class="skill-icon">${skill.icon}</span>
          <div class="skill-info">
            <div class="skill-name">
              <span>${skill.name}</span>
              <span class="skill-percent">${skill.proficiency}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-bar-fill" style="background: ${barColor}; --target: ${skill.proficiency}%"></div>
            </div>
            <div class="skill-superpower">${skill.superpower}</div>
          </div>
        </div>
      `).join('');

      // Animate bars after render
      requestAnimationFrame(() => {
        container.querySelectorAll('.skill-bar-fill').forEach(bar => {
          bar.classList.add('animate');
        });
      });
    }

    // Calculate total stats
    function calculateStats() {
      let total = 0, count = 0;
      SKILLS_DATA.categories.forEach(cat => {
        cat.skills.forEach(s => { total += s.proficiency; count++; });
      });
      return {
        average: Math.round(total / count),
        categories: SKILLS_DATA.categories.length,
        skills: count,
        topSkill: SKILLS_DATA.categories.flatMap(c => c.skills).sort((a, b) => b.proficiency - a.proficiency)[0]
      };
    }

    // Render app
    function render() {
      const app = document.getElementById('app');
      const stats = calculateStats();

      app.innerHTML = `
        <!-- Total stats card -->
        <div class="card full-width">
          <div class="total-stats">
            <div class="total-stat">
              <span class="number">${stats.average}%</span>
              <span class="label">Average Proficiency</span>
            </div>
            <div class="total-stat">
              <span class="number">${stats.categories}</span>
              <span class="label">Categories</span>
            </div>
            <div class="total-stat">
              <span class="number">${stats.skills}</span>
              <span class="label">Skills Tracked</span>
            </div>
            <div class="total-stat">
              <span class="number">${stats.topSkill.name}</span>
              <span class="label">Top Skill (${stats.topSkill.proficiency}%)</span>
            </div>
          </div>
        </div>

        ${SKILLS_DATA.categories.map(cat => `
          <div class="card">
            <h2>
              <span class="color-dot" style="background: ${cat.color}"></span>
              ${cat.icon} ${cat.name}
            </h2>
            <div class="chart-wrapper">
              <canvas id="radar-${cat.name.replace(/\s+/g, '-')}"></canvas>
            </div>
          </div>
          <div class="card">
            <h2>
              <span class="color-dot" style="background: ${cat.color}"></span>
              ${cat.icon} ${cat.name} Details
            </h2>
            <div class="skill-list" id="bars-${cat.name.replace(/\s+/g, '-')}"></div>
          </div>
        `).join('')}
      `;

      // Initialize charts and bars
      SKILLS_DATA.categories.forEach(cat => {
        createRadarChart(cat);
        buildSkillBars(cat);
      });
    }

    // Initial render
    render();

    // Re-render on theme change
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      // Destroy existing charts and re-render
      Chart.instances.forEach(instance => instance.destroy());
      render();
    });
  </script>
</body>
</html>
