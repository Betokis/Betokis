<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="340" fill="url(#bg-dark)" class="bg-dark"/>
  <rect width="800" height="340" fill="url(#bg-light)" class="bg-light" opacity="0"/>

  <!-- Decorative grid lines -->
  <g opacity="0.03" class="bg-dark">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- Terminal -->
  <rect x="30" y="20" width="740" height="300" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" class="border-dark"/>
  <rect x="30" y="20" width="740" height="300" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" class="border-light" opacity="0"/>

  <!-- Terminal title bar -->
  <rect x="30" y="20" width="740" height="38" rx="14" fill="#21262d" class="title-dark"/>
  <rect x="30" y="20" width="740" height="38" rx="14" fill="#eaeef2" class="title-light" opacity="0"/>
  <rect x="30" y="46" width="740" height="12" fill="#21262d" class="title-dark"/>
  <rect x="30" y="46" width="740" height="12" fill="#eaeef2" class="title-light" opacity="0"/>

  <!-- Window dots -->
  <circle cx="55" cy="39" r="6" fill="#ff6b6b"/>
  <circle cx="75" cy="39" r="6" fill="#ffd93d"/>
  <circle cx="95" cy="39" r="6" fill="#00d4aa"/>

  <!-- Terminal title text -->
  <text x="400" y="44" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e" class="title-dark">betokis@github:~/profile</text>
  <text x="400" y="44" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#656d76" class="title-light" opacity="0">betokis@github:~/profile</text>

  <!-- Prompt line 1 -->
  <text x="50" y="82" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e" class="prompt-dark">
    <tspan fill="#ff6b6b">⏣</tspan>
    <tspan fill="#00d4aa"> ~ </tspan>
    <tspan fill="#ffa657">curl -s </tspan>
    <tspan fill="#79c0ff">betokis.io/metadata</tspan>
    <tspan fill="#8b949e"> | jq '.'</tspan>
  </text>
  <text x="50" y="82" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#656d76" class="prompt-light" opacity="0">
    <tspan fill="#cf222e">⏣</tspan>
    <tspan fill="#00897b"> ~ </tspan>
    <tspan fill="#953800">curl -s </tspan>
    <tspan fill="#0550ae">betokis.io/metadata</tspan>
    <tspan fill="#656d76"> | jq '.'</tspan>
  </text>

  <!-- Output block -->
  <text x="50" y="112" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-1 output-dark">
    <tspan font-weight="bold" font-size="13">{</tspan>
  </text>
  <text x="50" y="112" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-1 output-light" opacity="0">
    <tspan font-weight="bold" font-size="13">{</tspan>
  </text>

  <!-- Identity -->
  <text x="50" y="138" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-2 output-dark">
    <tspan>  "identity": {</tspan>
  </text>
  <text x="50" y="138" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-2 output-light" opacity="0">
    <tspan>  "identity": {</tspan>
  </text>

  <text x="50" y="162" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-3 output-dark">
    <tspan>    "name": </tspan>
    <tspan fill="#a5d6ff">"Alberto Betokis"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="162" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-3 output-light" opacity="0">
    <tspan>    "name": </tspan>
    <tspan fill="#0550ae">"Alberto Betokis"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="186" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-4 output-dark">
    <tspan>    "role": </tspan>
    <tspan fill="#a5d6ff">"IB Diploma Student → Future CS Major"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="186" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-4 output-light" opacity="0">
    <tspan>    "role": </tspan>
    <tspan fill="#0550ae">"IB Diploma Student → Future CS Major"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="210" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-5 output-dark">
    <tspan>    "expertise": </tspan>
    <tspan fill="#a5d6ff">"Cybersecurity"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="210" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-5 output-light" opacity="0">
    <tspan>    "expertise": </tspan>
    <tspan fill="#0550ae">"Cybersecurity"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="234" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-6 output-dark">
    <tspan>    "passion": </tspan>
    <tspan fill="#a5d6ff">"Building production systems. Breaking them ethically. Making music."</tspan>
  </text>
  <text x="50" y="234" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-6 output-light" opacity="0">
    <tspan>    "passion": </tspan>
    <tspan fill="#0550ae">"Building production systems. Breaking them ethically. Making music."</tspan>
  </text>

  <text x="50" y="256" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-7 output-dark">
    <tspan>  },</tspan>
  </text>
  <text x="50" y="256" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-7 output-light" opacity="0">
    <tspan>  },</tspan>
  </text>

  <!-- Second field -->
  <text x="50" y="282" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-8 output-dark">
    <tspan>  "motto": </tspan>
    <tspan fill="#a5d6ff">"Student by day. Hacker by night. Builder always."</tspan>
  </text>
  <text x="50" y="282" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-8 output-light" opacity="0">
    <tspan>  "motto": </tspan>
    <tspan fill="#0550ae">"Student by day. Hacker by night. Builder always."</tspan>
  </text>

  <text x="50" y="306" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787" class="typing-9 output-dark">
    <tspan font-weight="bold" font-size="13">}</tspan>
    <tspan fill="#8b949e" font-size="14" filter="url(#glow)"> ■</tspan>
  </text>
  <text x="50" y="306" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#116329" class="typing-9 output-light" opacity="0">
    <tspan font-weight="bold" font-size="13">}</tspan>
    <tspan fill="#656d76" font-size="14" filter="url(#glow)"> ■</tspan>
  </text>

  <!-- Typing animations -->
  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .typing-1 { animation: fadeIn 0.3s ease-in forwards; }
    .typing-2 { animation: fadeIn 0.5s ease-in forwards; }
    .typing-3 { animation: fadeIn 0.8s ease-in forwards; }
    .typing-4 { animation: fadeIn 1.1s ease-in forwards; }
    .typing-5 { animation: fadeIn 1.4s ease-in forwards; }
    .typing-6 { animation: fadeIn 1.7s ease-in forwards; }
    .typing-7 { animation: fadeIn 2.0s ease-in forwards; }
    .typing-8 { animation: fadeIn 2.3s ease-in forwards; }
    .typing-9 { animation: fadeIn 2.6s ease-in forwards; }

    .bg-light, .border-light, .title-light, .prompt-light, .output-light { display: none; }
    .bg-dark, .border-dark, .title-dark, .prompt-dark, .output-dark { display: inline; }

    @media (prefers-color-scheme: light) {
      .bg-dark, .border-dark, .title-dark, .prompt-dark, .output-dark { display: none; }
      .bg-light, .border-light, .title-light, .prompt-light, .output-light { display: inline; }
    }
  </style>
</svg>