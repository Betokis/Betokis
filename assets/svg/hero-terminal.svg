<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a8e8"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897b"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark mode background -->
  <rect width="800" height="280" fill="url(#bg-dark)" class="bg-dark"/>
  <rect width="800" height="280" fill="url(#bg-light)" class="bg-light" opacity="0"/>

  <!-- Terminal border -->
  <rect x="30" y="20" width="740" height="240" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" class="border-dark"/>
  <rect x="30" y="20" width="740" height="240" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" class="border-light" opacity="0"/>

  <!-- Terminal title bar -->
  <rect x="30" y="20" width="740" height="36" rx="12" fill="#21262d" class="title-dark"/>
  <rect x="30" y="20" width="740" height="36" rx="12" fill="#eaeef2" class="title-light" opacity="0"/>
  <rect x="30" y="44" width="740" height="12" fill="#21262d" class="title-dark"/>
  <rect x="30" y="44" width="740" height="12" fill="#eaeef2" class="title-light" opacity="0"/>

  <!-- Dots -->
  <circle cx="55" cy="38" r="6" fill="#ff6b6b"/>
  <circle cx="75" cy="38" r="6" fill="#ffd93d"/>
  <circle cx="95" cy="38" r="6" fill="#00d4aa"/>

  <!-- Prompt line 1 -->
  <text x="50" y="80" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e" class="prompt-dark">
    <tspan fill="#ff6b6b">⏣</tspan>
    <tspan fill="#00d4aa"> ~ </tspan>
    <tspan fill="#ffa657">cat </tspan>
    <tspan fill="#79c0ff">/home/betokis/whoami.json</tspan>
  </text>
  <text x="50" y="80" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#656d76" class="prompt-light" opacity="0">
    <tspan fill="#cf222e">⏣</tspan>
    <tspan fill="#00897b"> ~ </tspan>
    <tspan fill="#953800">cat </tspan>
    <tspan fill="#0550ae">/home/betokis/whoami.json</tspan>
  </text>

  <!-- Output (with typing animation) -->
  <text x="50" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark">
    <tspan>{</tspan>
  </text>
  <text x="50" y="108" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>{</tspan>
  </text>

  <text x="50" y="130" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark typing-1">
    <tspan>  "name": </tspan>
    <tspan fill="#a5d6ff">"Alberto Betokis"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="130" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>  "name": </tspan>
    <tspan fill="#0550ae">"Alberto Betokis"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="152" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark typing-2">
    <tspan>  "role": </tspan>
    <tspan fill="#a5d6ff">"Full-Stack Engineer / Cybersecurity Researcher"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="152" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>  "role": </tspan>
    <tspan fill="#0550ae">"Full-Stack Engineer / Cybersecurity Researcher"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="174" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark typing-3">
    <tspan>  "location": </tspan>
    <tspan fill="#a5d6ff">"Barranquilla, Colombia"</tspan>
    <tspan>,</tspan>
  </text>
  <text x="50" y="174" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>  "location": </tspan>
    <tspan fill="#0550ae">"Barranquilla, Colombia"</tspan>
    <tspan>,</tspan>
  </text>

  <text x="50" y="196" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark typing-4">
    <tspan>  "passion": </tspan>
    <tspan fill="#a5d6ff">"Building things. Breaking things (ethically). Making music."</tspan>
  </text>
  <text x="50" y="196" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>  "passion": </tspan>
    <tspan fill="#0550ae">"Building things. Breaking things (ethically). Making music."</tspan>
  </text>

  <text x="50" y="222" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#7ee787" class="output-dark">
    <tspan>}</tspan>
    <tspan fill="#8b949e" font-size="12">  █</tspan>
  </text>
  <text x="50" y="222" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#116329" class="output-light" opacity="0">
    <tspan>}</tspan>
    <tspan fill="#656d76" font-size="12">  █</tspan>
  </text>

  <!-- Blinking cursor animation -->
  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes typing1 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes typing2 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes typing3 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes typing4 { from { opacity: 0; } to { opacity: 1; } }

    .typing-1 { animation: typing1 0.5s ease-in; }
    .typing-2 { animation: typing2 1.0s ease-in; }
    .typing-3 { animation: typing3 1.5s ease-in; }
    .typing-4 { animation: typing4 2.0s ease-in; }

    /* Dark mode is default */
    .bg-light, .border-light, .title-light, .prompt-light, .output-light { display: none; }
    .bg-dark, .border-dark, .title-dark, .prompt-dark, .output-dark { display: inline; }

    /* Light mode override */
    @media (prefers-color-scheme: light) {
      .bg-dark, .border-dark, .title-dark, .prompt-dark, .output-dark { display: none; }
      .bg-light, .border-light, .title-light, .prompt-light, .output-light { display: inline; }
    }
  </style>
</svg>